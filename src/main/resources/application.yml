spring:
  application:
    name: mathbot-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mathbot}
    username: ${DB_USERNAME:mathbot}
    password: ${DB_PASSWORD:mathbot}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

server:
  port: 8080

mathbot:
  jwt:
    secret: ${JWT_SECRET_KEY:change-me-in-production-min-32-chars!!}
    access-token-expiry-ms: 900000   # 15 min
  claude:
    api-key: ${CLAUDE_API_KEY:placeholder}

management:
  endpoints:
    web:
      exposure:
        include: health
